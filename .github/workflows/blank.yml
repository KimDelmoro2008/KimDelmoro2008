name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: 
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

           # Base stats (commits, PRs, issues, stars) - likely already on
          base: header, activity, community, repositories, metadata

          # Most-used languages, as a donut chart
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_threshold: 0%

          # GitHub-style activity calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Recent activity feed (commits, issues, PRs, releases)
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14

          # Lines of code changed (adds/removed)
          plugin_lines: yes

          # Achievements / badges (needs an extra scope, see below)
          plugin_achievements: yes
          plugin_achievements_threshold: C

          # Repos you've starred recently
          plugin_stars: yes
          plugin_stars_limit: 4

          # Topics your repos use, as a word cloud
          plugin_topics: yes
          plugin_topics_mode: icons
